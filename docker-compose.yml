# Percival Deep Research MCP server.
#
# Stdio (one-shot MCP client process):
#   docker compose run --rm -T percival-deep-research-stdio
#
# Streamable HTTP (opt-in, host loopback by default):
#   docker compose --profile http up -d percival-deep-research-http
#
# Production profile also starts the HTTP service and nginx; provide a reviewed
# local ./nginx.conf with authentication/TLS policy before starting that profile.

x-runtime-environment: &runtime-environment
  # Runtime settings, including credentials, are read from the mounted
  # /app/.env file by runtime_env.py. Do not set empty placeholders here:
  # load_dotenv(override=False) would preserve them and shadow the file.
  PYTHONUNBUFFERED: "1"

x-common: &common
  build:
    context: .
    dockerfile: Dockerfile
  image: ${PERCIVAL_DEEP_RESEARCH_IMAGE:-percival-deep-research:dev}
  # The launcher owns the init layer; the image embeds none. One init only.
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  # UID/GID 1000 matches the image's `percival` user, so the bind mounts below
  # are writable by the process.
  user: "1000:1000"
  volumes:
    # These host directories must exist and be writable by image UID/GID 1000.
    - type: bind
      source: ./logs
      target: /app/logs
      bind:
        create_host_path: false
    - type: bind
      source: ./reports
      target: /app/reports
      bind:
        create_host_path: false
    # Private environment file with the inference credential. The server
    # reads it through `runtime_env.load_dotenv("/app/.env")`; the file is
    # mounted read-only and never rendered into the environment.
    - type: bind
      source: ${DEEP_RESEARCH_ENV_HOST_PATH:-./.env}
      target: /app/.env
      read_only: true
      bind:
        create_host_path: false

services:
  percival-deep-research-stdio:
    <<: *common
    profiles: ["stdio"]
    stdin_open: true
    tty: false
    restart: "no"
    environment:
      <<: *runtime-environment
      MCP_TRANSPORT: stdio

  percival-deep-research-http:
    <<: *common
    profiles: ["http", "production"]
    environment:
      <<: *runtime-environment
      # The transport is pinned, not interpolated: an operator-wide
      # `MCP_TRANSPORT` in the environment or in a mounted `.env` must not be
      # able to turn the HTTP profile into a stdio one (or the reverse).
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      PORT: "8000"
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8000}:8000"
    restart: unless-stopped
    # /health reports configuration readiness (200 healthy / 503 degraded),
    # not upstream API availability. Either response proves the HTTP process
    # is serving; an upstream/configuration issue must not look like a dead PID.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          code=$$(python -c "import http.client,sys; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=3); c.request('GET','/health'); s=c.getresponse().status; sys.exit(0 if s in (200,503) else 1)" 2>/dev/null && echo 200 || echo 000);
          case "$$code" in 200|503) exit 0 ;; *) exit 1 ;; esac
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:alpine
    profiles: ["production"]
    init: true
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,mode=1777
      - /var/run:size=1m,mode=1775
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # nginx:alpine ships an `nginx` user (uid 101) and an unprivileged port
    # 8080. The published ports below map to that port, so the proxy never
    # needs a privileged port nor root.
    user: "101:101"
    ports:
      # Loopback by default. Publishing on every interface is an explicit
      # operator choice and requires the reviewed TLS/auth policy.
      - "${NGINX_HTTP_BIND_ADDRESS:-127.0.0.1}:${NGINX_HTTP_PORT:-8080}:8080"
      - "${NGINX_HTTPS_BIND_ADDRESS:-127.0.0.1}:${NGINX_HTTPS_PORT:-8443}:8443"
    volumes:
      # The operator-provided configuration must exist: a missing file must
      # fail loudly instead of being created by the daemon as a directory.
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      percival-deep-research-http:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          code=$$(wget -q -O /dev/null http://127.0.0.1:8080/ 2>/dev/null && echo 200 || echo 000);
          case "$$code" in 200) exit 0 ;; *) exit 1 ;; esac
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-percival-deep-research}_net
